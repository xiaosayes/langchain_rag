[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-core"
version = "0.1.0"
description = "Enterprise retrieval-augmented generation core"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1,<2",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "SQLAlchemy>=2,<2.1",
    "qdrant-client>=1.15,<1.16",
    "httpx>=0.28,<1",
    "typer>=0.16,<1",
    "rank-bm25>=0.2.2,<1",
    "jieba>=0.42,<1",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "Pillow>=11,<13",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.3,<4",
    "paddlepaddle>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
    "mypy",
    "testcontainers",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ocr: tests that run real CPU PaddleOCR recognition",
    "bailian: real Bailian API smoke tests",
    "integration: tests that run real Qdrant infrastructure",
]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
